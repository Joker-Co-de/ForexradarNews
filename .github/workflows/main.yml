name: Forex Radar News Bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run PipPulse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python bot.py
      - name: Save alert history
        run: |
          git config user.name "PipPulse Bot"
          git config user.email "pipulse-bot@users.noreply.github.com"
          git add sent_events.json
          git diff --cached --quiet || git commit -m "Update alert history"
          git push
